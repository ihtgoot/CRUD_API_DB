<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-delete {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-edit {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .book-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .book-card p {
            color: #666;
            margin-bottom: 8px;
        }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .book-actions button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Bookstore Management</h1>

        <div id="alert"></div>

        <div class="card">
            <h2 style="margin-bottom: 20px; color: #667eea;">Add New Book</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="name">Book Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" required>
                </div>
                <div class="form-group">
                    <label for="publication">Publication</label>
                    <input type="text" id="publication" required>
                </div>
                <button type="submit">Add Book</button>
            </form>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px; color: #667eea;">All Books</h2>
            <div id="booksContainer" class="books-grid"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:9010';

        function showAlert(message, type = 'success') {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 3000);
        }

        async function fetchBooks() {
            try {
                const response = await fetch(`${API_URL}/book/`);
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showAlert('Error fetching books: ' + error.message, 'error');
            }
        }

        function displayBooks(books) {
            const container = document.getElementById('booksContainer');
            
            if (!books || books.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">No books available</p>';
                return;
            }

            container.innerHTML = books.map(book => `
                <div class="book-card">
                    <h3>${book.name}</h3>
                    <p><strong>Author:</strong> ${book.author}</p>
                    <p><strong>Publication:</strong> ${book.publication}</p>
                    <p style="font-size: 12px; color: #999;"><strong>ID:</strong> ${book.ID}</p>
                    <div class="book-actions">
                        <button class="btn-edit" onclick="editBook(${book.ID})">Edit</button>
                        <button class="btn-delete" onclick="deleteBook(${book.ID})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const book = {
                name: document.getElementById('name').value,
                author: document.getElementById('author').value,
                publication: document.getElementById('publication').value
            };

            try {
                const response = await fetch(`${API_URL}/book/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(book)
                });

                if (response.ok) {
                    showAlert('Book added successfully!');
                    document.getElementById('bookForm').reset();
                    fetchBooks();
                } else {
                    showAlert('Error adding book', 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        });

        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) return;

            try {
                const response = await fetch(`${API_URL}/book/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Book deleted successfully!');
                    fetchBooks();
                } else {
                    showAlert('Error deleting book', 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function editBook(id) {
            const name = prompt('Enter new book name:');
            const author = prompt('Enter new author:');
            const publication = prompt('Enter new publication:');

            if (!name && !author && !publication) return;

            const updates = {};
            if (name) updates.name = name;
            if (author) updates.author = author;
            if (publication) updates.publication = publication;

            try {
                const response = await fetch(`${API_URL}/book/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                if (response.ok) {
                    showAlert('Book updated successfully!');
                    fetchBooks();
                } else {
                    showAlert('Error updating book', 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        // Load books on page load
        fetchBooks();
    </script>
</body>
</html>
